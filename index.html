<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T-Shirt Store</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    h1 { text-align: center; }
    .product { border: 1px solid #ccc; padding: 10px; margin: 10px auto; max-width: 300px; background: #fff; }
    .product img { width: 100%; }
    .btn { display: block; text-align: center; margin-top: 10px; padding: 10px; background: #28a745; color: white; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Simple T-Shirt Store</h1>
  <div class="product">
    <img src="https://via.placeholder.com/300x300?text=T-Shirt+1" alt="T-Shirt 1">
    <h3>Classic Black T-Shirt</h3>
    <p>Price: ₹499</p>
    <a href="login.html" class="btn">Order Now</a>
  </div>
  <div class="product">
    <img src="https://via.placeholder.com/300x300?text=T-Shirt+2" alt="T-Shirt 2">
    <h3>White V-Neck T-Shirt</h3>
    <p>Price: ₹599</p>
    <a href="login.html" class="btn">Order Now</a>
  </div>
</body>
</html>

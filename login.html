<!DOCTYPE html>
<html>
<head>
  <title>Login - T-Shirt Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial; background: #f9f9f9; padding: 20px; }
    form { max-width: 400px; margin: auto; background: #fff; padding: 20px; border-radius: 5px; }
    input, button { width: 100%; padding: 10px; margin: 10px 0; }
    button { background: #007bff; color: white; border: none; }
    a { display: block; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Login or Sign Up</h2>
  <form id="authForm">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
    <button type="button" onclick="signup()">Sign Up</button>
    <button type="button" onclick="resetPassword()">Reset Password</button>
    <a href="index.html">← Back to Home</a>
  </form>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    document.getElementById('authForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = email.value;
      const password = password.value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => window.location.href = "order.html")
        .catch(e => alert("Login Failed: " + e.message));
    });

    function signup() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => alert("Signup successful. You can now login."))
        .catch(e => alert("Signup Failed: " + e.message));
    }

    function resetPassword() {
      const email = document.getElementById("email").value;
      auth.sendPasswordResetEmail(email)
        .then(() => alert("Password reset email sent."))
        .catch(e => alert("Error: " + e.message));
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Order Your T-Shirt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial; background: #f9f9f9; padding: 20px; }
    form { max-width: 400px; margin: auto; background: #fff; padding: 20px; border-radius: 5px; }
    input, button { width: 100%; padding: 10px; margin: 10px 0; }
    button { background: #28a745; color: white; border: none; }
    a { display: block; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Place Your Order</h2>
  <form action="https://docs.google.com/forms/d/e/YOUR_FORM_ID/formResponse" method="POST">
    <label for="name">Full Name</label>
    <input type="text" name="entry.123456789" id="name" placeholder="Your Name" required />
    
    <label for="address">Address</label>
    <input type="text" name="entry.987654321" id="address" placeholder="Your Address" required />
    
    <label for="phone">Phone Number</label>
    <input type="text" name="entry.1122334455" id="phone" placeholder="Your Phone Number" required />
    
    <label for="pincode">Pincode</label>
    <input type="text" name="entry.5566778899" id="pincode" placeholder="Your Pincode" required />
    
    <button type="submit">Submit Order</button>
  </form>
  <a href="index.html">← Back to Home</a>
</body>
</html>
